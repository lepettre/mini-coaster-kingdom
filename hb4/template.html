const scr=document.createElement('canvas');scr.width=4;scr.height=4;{const g=scr.getContext('2d');g.fillStyle='#1E0D0B';g.fillRect(0,0,2,2);g.fillRect(2,2,2,2)}const scrim=ctx.createPattern(scr,'repeat');

// ---------- Symbole ----------
function bolt(x,y,c){c=c||'#F2C12E';[[3,0,2,1],[2,1,2,1],[1,2,2,1],[0,3,4,1],[2,4,2,1],[1,5,2,1],[0,6,2,1]].forEach(r=>ui.fr(x+r[0],y+r[1],r[2],r[3],c))}
function wave(x,y,c){c=c||'#F28B7E';[[0,3],[1,2],[2,1],[3,2],[4,3],[5,4],[6,3],[7,2]].forEach(p=>{ui.fr(x+p[0],y+p[1],1,2,c)})}
function tacho(x,y,c){c=c||'#2E4FA8';[[0,5],[0,4],[1,3],[2,2],[3,1],[4,1],[5,1],[6,2],[7,3],[8,4],[8,5]].forEach(p=>ui.px(x+p[0],y+p[1],c));ui.line(x+4,y+5,x+6,y+2,c)}
function star(x,y,on){const c=on?'#F2C12E':C.hi,d=on?'#8A6A00':C.lo;const rows=['......#......','.....###.....','.....###.....','#############','.###########.','..#########..','...#######...','...#######...','..####.####..','..###...###..','.##.......##.'];rows.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='#')ui.px(x+i,y+j,c)});[[6,0],[5,1],[7,1],[0,3],[12,3],[1,4],[11,4],[2,5],[10,5],[3,6],[9,6],[2,8],[10,8],[1,10],[11,10]].forEach(p=>ui.px(x+p[0],y+p[1],d))}
function face(x,y,kind){ui.fr(x+1,y,10,12,'#FFFFFF');ui.fr(x,y+1,12,10,'#FFFFFF');ui.fr(x+2,y+1,8,10,kind==='ok'?'#F2C12E':kind==='sick'?'#9BCB3C':'#B9C2CC');ui.fr(x+1,y+3,10,6,kind==='ok'?'#F2C12E':kind==='sick'?'#9BCB3C':'#B9C2CC');ui.px(x+3,y+4,'#141B2A');ui.px(x+8,y+4,'#141B2A');ui.px(x+3,y+5,'#141B2A');ui.px(x+8,y+5,'#141B2A');
  if(kind==='ok'){ui.px(x+3,y+7,'#141B2A');ui.fr(x+4,y+8,4,1,'#141B2A');ui.px(x+8,y+7,'#141B2A')}else if(kind==='sick'){ui.fr(x+3,y+8,6,1,'#141B2A');ui.px(x+2,y+9,'#141B2A');ui.px(x+9,y+9,'#141B2A')}else ui.fr(x+3,y+8,6,1,'#141B2A');
  ui.px(x+1,y+11,'#FFFFFF');ui.px(x,y+12,'#FFFFFF')}
function pieceIcon(k,x,y){
  ui.fr(x,y,20,20,'#5DAE34');for(let j=0;j<20;j++)for(let i=(j&1);i<20;i+=2)ui.px(x+i,y+j,'#4F9A2B');
  const tr=(px_,py_)=>{ui.fr(px_-2,py_-2,5,5,'#7A1410');};const tr2=(px_,py_)=>{ui.fr(px_-1,py_-1,3,3,'#D8312B');};
  const straight=()=>{ui.fr(x+7,y,6,20,'#7A1410');ui.fr(x+8,y,4,20,'#D8312B');ui.fr(x+8,y,1,20,'#F27A66');for(let t=2;t<20;t+=5)ui.fr(x+6,y+t,8,1,'#E7E7E7')};
  const arc=(dir)=>{const pts=[];for(let a=0;a<=20;a++){const t=a/20*Math.PI/2;const cx=dir>0?20:0,sx=dir>0?-1:1;pts.push([Math.round(cx+sx*10*Math.cos(t)),Math.round(19-10*Math.sin(t)+0)])}pts.forEach(p=>tr(x+p[0],y+p[1]));pts.forEach(p=>tr2(x+p[0],y+p[1]));ui.fr(x+8,y+19,4,1,'#D8312B')};
  if(k==='G')straight();
  else if(k==='R')arc(1);
  else if(k==='L')arc(-1);
  else if(k==='A'){straight();ui.line(x+6,y+8,x+10,y+4,'#FFFFFF');ui.line(x+10,y+4,x+14,y+8,'#FFFFFF');ui.line(x+6,y+14,x+10,y+10,'#FFFFFF');ui.line(x+10,y+10,x+14,y+14,'#FFFFFF')}
  else if(k==='B'){straight();ui.line(x+6,y+5,x+10,y+9,'#FFFFFF');ui.line(x+10,y+9,x+14,y+5,'#FFFFFF');ui.line(x+6,y+11,x+10,y+15,'#FFFFFF');ui.line(x+10,y+15,x+14,y+11,'#FFFFFF')}
  else if(k==='P'){for(let a=0;a<48;a++){const t=a/48*Math.PI*2;const px_=Math.round(x+10+6*Math.cos(t)),py_=Math.round(y+8+6*Math.sin(t));tr(px_,py_)}for(let a=0;a<48;a++){const t=a/48*Math.PI*2;tr2(Math.round(x+10+6*Math.cos(t)),Math.round(y+8+6*Math.sin(t)))}ui.fr(x+8,y+14,4,6,'#D8312B')}
}

// ---------- Layout ----------
function setup(){

  Wu=Math.floor(Wc/U);Hu=Math.floor(Hc/U);
  const bwH=132;lay.bw={x:3,y:Hu-3-bwH,w:Wu-6,h:bwH};lay.areaTop=16*U;lay.areaBottom=(lay.bw.y-2)*U;lay.areaH=lay.areaBottom-lay.areaTop;
  bgArea=HBR.makeBgArea(Wc,lay.areaH,Math.round(lay.areaH*.46),TH());
  cam=focus();
}
function focus(){
  const P=HBR.proj(L);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const add=(i,j,z)=>{const p=P(i+.5,j+.5,z);x0=Math.min(x0,p[0]-34);x1=Math.max(x1,p[0]+34);y0=Math.min(y0,p[1]-40);y1=Math.max(y1,p[1]+20)};
  run.track.forEach(p=>add(p.i,p.j,p.z1));run.ret.forEach(p=>add(p.i,p.j,0));add(LEVEL.target[0],LEVEL.target[1],0);add(run.head.i,run.head.j,run.head.z);
  return{x:(x0+x1)/2,y:(y0+y1)/2-6}
}
function clampCam(){const mx=Wc/2-70,Mx=L.W-Wc/2+70,my=lay.areaH/2-50,My=L.H-lay.areaH/2+50;cam.x=Math.max(Math.min(mx,Mx),Math.min(Math.max(mx,Mx),cam.x));cam.y=Math.max(Math.min(my,My),Math.min(Math.max(my,My),cam.y))}
function newRun(){hintK=null;hintSeq=null;run=HB.newRun(LEVEL);path=HBR.buildPath(run,false);sel=null;mode='build';cars=null;partial=null;result=null;camManual=false;if(L)cam=focus()}
function loadLevel(i){hintUsed=false;hintK=null;hintSeq=null;hintMsg='';LEVEL=LEVELS[i];saved.cur=i;store.set('hb4',saved);stat=null;statKey='';overlay=saved.help?null:'help';inGame=true;init()}
const STY={meadow:'B1',winter:'A2',desert:'D1',coast:'C1'},TCOL={meadow:['red','blue','green'],winter:['blue','red'],desert:['orange','red'],coast:['green','blue']},THEMES=['meadow','winter','desert','coast'],DIFFN=['Leicht','Mittel','Schwer'];
const SPECS=[{min:8,max:12,groups:[['kids'],['fam']],loop:'no',extras:1,pond:[4,6],maxSol:30},{min:10,max:14,groups:[['fam'],['teens']],loop:'allow',extras:1,pond:[4,6],maxSol:12},{min:12,max:17,groups:[['teens'],['fans']],loop:'allow',extras:2,pond:[4,6],maxSol:6,budget:15000}];
const TCODE={m:'meadow',w:'winter',d:'desert',k:'coast'};
function randLevel(base,diff,seed){const th=THEMES[(seed>>>3)%4];return Object.assign({},base,{id:'z'+seed,name:'Zufall '+DIFFN[diff],theme:th,style:STY[th],trackCol:TCOL[th][seed%TCOL[th].length],chapter:0,rnd:true,diff})}
function expandPool(e,seed){const b=LEVELS[0];return randLevel(Object.assign({},b,{blocked:e.b,inv:e.i,groups:e.g,par:e.p}),e.d,seed)}
function playRandom(l){hintUsed=false;hintK=null;hintSeq=null;hintMsg='';inGame=true;LEVEL=l;stat=null;statKey='';busyMsg='';overlay=null;init()}
function startRandom(diff){
  lastDiff=diff;overlay='busy';busyMsg='Erzeuge Rätsel...';const t0=performance.now();
  const step=()=>{
    const seed=(Math.random()*1e9)|0;let l=null;try{l=HBG.make(SPECS[diff],seed,2)}catch(e){l=null}
    if(l){playRandom(randLevel(l,diff,seed));return}
    if(performance.now()-t0<4500){setTimeout(step,0);return}
    const cand=POOL.filter(e=>e.d===diff);const e=(cand.length?cand:POOL)[Math.floor(Math.random()*(cand.length||POOL.length))];
    if(e)playRandom(expandPool(e,seed));else{overlay='rand'}
  };setTimeout(step,30);
}
function totalStars(){let s=0;LEVELS.forEach(l=>{s+=stars_(l.id)});return s}
function nextOpen(){for(let i=0;i<LEVELS.length;i++)if(unlocked(i)&&stars_(LEVELS[i].id)<1)return i;return Math.min(LEVELS.length-1,Math.max(0,lvIdx()))}
function bigT(x,y,s,col){ctx.save();ctx.translate(x*U,y*U);ctx.scale(2,2);T(0,0,s,col,C.ink);ctx.restore()}
function init(){
  HBR.setPalette(LEVEL.theme==='coast'?'coast':'base');L=null;newRun();L=HBR.layout(run.n,run.zmax);sceneCv=document.createElement('canvas');sceneCv.width=L.W;sceneCv.height=L.H;sctx=sceneCv.getContext('2d',{willReadFrequently:true});
  const reserved=new Set();LEVEL.blocked.concat(LEVEL.deco).forEach(b=>reserved.add(b[0]+','+b[1]));run.ret.forEach(r=>reserved.add(r.i+','+r.j));for(let s=0;s<=3;s++)reserved.add((LEVEL.station[0]+s)+','+LEVEL.station[1]);
  ground=HBR.makeGround(L,TH(),LEVEL.id,reserved,LEVEL.blocked,[[1,4],[2,4]]);decor=HBR.makeDecor(LEVEL.id,run.n,TH(),reserved);
  setup();
}

// ---------- Zeichnen ----------
function bar(x,y,w,lo,hi,val,prev,col){
  ui.inset(x,y,w,8);const iw=w-4,sc=iw/10;
  ui.fr(x+2,y+2,iw,4,'#6F7F99');
  ui.fr(x+2+Math.round(lo*sc),y+2,Math.max(1,Math.round((Math.min(hi,10)-lo)*sc)),4,col);
  if(prev!=null){const px_=x+2+Math.round(Math.min(10,prev)*sc);for(let j=0;j<8;j+=2)ui.fr(px_,y+j,1,1,'#F2C12E')}
  const mx=x+2+Math.round(Math.min(10,val)*sc);ui.fr(mx-1,y-1,3,10,'#141B2A');ui.fr(mx,y,1,8,'#FFFFFF');
}
function guestsWin(){
  const x=3,y=18,w=112,g=run.groups,h=14+g.length*38+2;
  ui.win(x,y,w,h,'Gäste');
  const t=partial?partial.t:run.thrill,n=partial?partial.n:run.nausea;
  let pt=null,pn=null;if(sel&&!partial){const gh=HB.ghost(run,sel);if(gh.valid){const e=HB.effect(run,gh);pt=run.thrill+e.t;pn=run.nausea+e.n}}
  g.forEach((gr,k)=>{const yy=y+14+k*38;sprite(gr.id,x+5,yy+4);T(x+20,yy+2,gr.name,C.txt);
    bolt(x+20,yy+13,'#8A6A00');bar(x+30,yy+12,54,exc(gr.t[0]),exc(gr.t[1]),exc(t),pt!=null?exc(pt):null,'#3B8528');T(x+87,yy+12,fmt(exc(t)),C.txt);
    wave(x+20,yy+25,'#9B2A1B');bar(x+30,yy+24,54,0,nau(gr.n),nau(n),pn!=null?nau(pn):null,'#C4584C');T(x+87,yy+24,fmt(nau(n)),C.txt);
    const ok=HB.judge(run).res[k].ok&&(run.placed>0);if(mode==='build'&&ok&&HB.ready(run))ui.fr(x+w-9,yy+2,5,5,'#3B8528');});
}
function schwungWin(){
  const w=70,x=Wu-3-w,y=18;ui.win(x,y,w,28,'Schwung');
  tacho(x+5,y+17,'#2E4FA8');ui.inset(x+18,y+16,w-23,8);const k=partialK!=null?partialK:run.head.k,iw=w-27;ui.fr(x+20,y+18,iw,4,C.lo);ui.fr(x+20,y+18,Math.max(1,Math.round(Math.min(1,k/3.6)*iw)),4,'#F2C12E');
  if(sel&&!partial){const gh=HB.ghost(run,sel);if(gh.valid){const pk=Math.min(1,gh.kExit/3.6)*iw;for(let j=0;j<4;j+=2)ui.fr(x+20+Math.round(pk),y+17+j,1,1,C.txt)}}
}
let partialK=null,hintUsed=false,hintMsg='',hintT=0,hintK=null,hintKey='',hintSeq=null,hintMsgKey='';
