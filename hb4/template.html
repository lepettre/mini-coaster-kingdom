function bolt(x,y,c){c=c||'#F2C12E';[[3,0,2,1],[2,1,2,1],[1,2,2,1],[0,3,4,1],[2,4,2,1],[1,5,2,1],[0,6,2,1]].forEach(r=>ui.fr(x+r[0],y+r[1],r[2],r[3],c))}

function star(x,y,on){const c=on?'#F2C12E':C.hi,d=on?'#8A6A00':C.lo;const rows=['......#......','.....###.....','.....###.....','#############','.###########.','..#########..','...#######...','...#######...','..####.####..','..###...###..','.##.......##.'];rows.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='#')ui.px(x+i,y+j,c)});[[6,0],[5,1],[7,1],[0,3],[12,3],[1,4],[11,4],[2,5],[10,5],[3,6],[9,6],[2,8],[10,8],[1,10],[11,10]].forEach(p=>ui.px(x+p[0],y+p[1],d))}
function face(x,y,kind){ui.fr(x+1,y,10,12,'#FFFFFF');ui.fr(x,y+1,12,10,'#FFFFFF');ui.fr(x+2,y+1,8,10,kind==='ok'?'#F2C12E':kind==='sick'?'#9BCB3C':'#B9C2CC');ui.fr(x+1,y+3,10,6,kind==='ok'?'#F2C12E':kind==='sick'?'#9BCB3C':'#B9C2CC');ui.px(x+3,y+4,'#141B2A');ui.px(x+8,y+4,'#141B2A');ui.px(x+3,y+5,'#141B2A');ui.px(x+8,y+5,'#141B2A');
  if(kind==='ok'){ui.px(x+3,y+7,'#141B2A');ui.fr(x+4,y+8,4,1,'#141B2A');ui.px(x+8,y+7,'#141B2A')}else if(kind==='sick'){ui.fr(x+3,y+8,6,1,'#141B2A');ui.px(x+2,y+9,'#141B2A');ui.px(x+9,y+9,'#141B2A')}else ui.fr(x+3,y+8,6,1,'#141B2A');
  ui.px(x+1,y+11,'#FFFFFF');ui.px(x,y+12,'#FFFFFF')}
function pieceIcon(k,x,y){
  ui.fr(x,y,20,20,'#5DAE34');for(let j=0;j<20;j++)for(let i=(j&1);i<20;i+=2)ui.px(x+i,y+j,'#4F9A2B');
  const tr=(px_,py_)=>{ui.fr(px_-2,py_-2,5,5,'#7A1410');};const tr2=(px_,py_)=>{ui.fr(px_-1,py_-1,3,3,'#D8312B');};
  // Strecke als breites Band (V1, Jan 2026-10-19): dunkler Rand, rot, helle Kante rechts, keine Querstriche
  const BAND=['#7A1410','#D8312B','#D8312B','#D8312B','#D8312B','#F27A66','#7A1410'],bandAt=(i,j,d)=>{const f=Math.floor(d+3);if(f>=0&&f<7)ui.px(x+i,y+j,BAND[f])};
  const straight=()=>{for(let j=0;j<20;j++)for(let i=7;i<14;i++)bandAt(i,j,i+.5-10)};
  // Pfeil 5×7 im dunklen Kästchen; bergab ist exakt das gespiegelte Bergauf
  const AR=['..#..','.###.','#####','..#..','..#..','..#..','..#..'],arrow=up=>{ui.fr(x+14,y+1,6,10,'#3A1512');(up?AR:AR.slice().reverse()).forEach((row,j)=>{for(let i=0;i<5;i++)if(row[i]==='#')ui.px(x+14+i,y+2+j,'#FFE27A')})};
  // Bogen aus zwei Schienen wie bei der Geraden (Schienen bei x 7 und 12)
  const ring=(cx,cy,rr)=>{for(let j=0;j<20;j++)for(let i=0;i<20;i++)bandAt(i,j,Math.hypot(i+.5-cx,j+.5-cy)-rr)};
  const arc=dir=>{if(dir>0)ring(20,20,10);else{for(let j=0;j<20;j++)for(let i=0;i<20;i++)bandAt(i,j,10-Math.hypot(i+.5,j+.5-20))}};
  if(k==='G')straight();
  else if(k==='R')arc(1);
  else if(k==='L')arc(-1);
  else if(k==='A'){straight();arrow(true)}
  else if(k==='B'){straight();arrow(false)}
  else if(k==='H'){straight();for(let t=3;t<18;t+=3)ui.fr(x+7,y+t,6,2,t%2?'#F2C12E':'#2B2B2B')}
  else if(k==='V'){straight();[4,10].forEach(t=>{ui.line(x+5,y+t+5,x+10,y+t,'#F5A04A');ui.line(x+10,y+t,x+15,y+t+5,'#F5A04A');ui.line(x+5,y+t+6,x+10,y+t+1,'#B5560F');ui.line(x+10,y+t+1,x+15,y+t+6,'#B5560F')})}
  else if(k==='W'){ui.fr(x,y,20,20,'#2F7BC8');for(let j=0;j<20;j+=4)ui.fr(x+(j%8),y+j,6,1,'#7DBBEE');straight();[[3,5],[15,8],[4,13],[16,15],[2,9]].forEach(p=>ui.fr(x+p[0],y+p[1],2,2,'#FFFFFF'))}

  else if(k==='C'){ui.fr(x+9,y,2,20,'#8A8F9A');const P=[];for(let j=0;j<20;j++){const a=j/20*Math.PI*2;[0,Math.PI].forEach(ph=>P.push({x:Math.round(9.5+3*Math.cos(a+ph)),j,f:Math.sin(a+ph)>0}))}
    P.filter(p=>!p.f).forEach(p=>ui.fr(x+p.x-1,y+p.j,3,1,'#5A1310'));P.filter(p=>p.f).forEach(p=>{ui.fr(x+p.x-1,y+p.j,3,1,'#D8312B');ui.px(x+p.x-1,y+p.j,'#F27A66')})}
  // Looping (Jan 2026-10-19): Seitenansicht wie eine echte Fahrt – flach rein, tropfenförmig hoch, kopfüber, runter,

  else if(k==='P'){const B5=['#7A1410','#D8312B','#D8312B','#F27A66','#7A1410'],a=1,b=6,sy=1.1,cy=10.5,yb=cy+sy*b,xl=10-a*Math.PI,xr=10+a*Math.PI;
    const tro=(f0,f1)=>{const P=[];for(let n=0;n<=60;n++){const f=f0+(f1-f0)*n/60;P.push([10+a*f-b*Math.sin(f),cy-sy*b*Math.cos(f)])}return P};
    // Enden offen (keine runde Kappe), damit an der Naht oben keine dunkle Querlinie entsteht
    const band=pts=>{const n=pts.length-1;for(let j=0;j<20;j++)for(let i=0;i<20;i++){const qx=i+.5,qy=j+.5;let best=9,sd=0,cap=false;
      for(let k=0;k<n;k++){const [ax,ay]=pts[k],[bx,by]=pts[k+1],dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1,t0=((qx-ax)*dx+(qy-ay)*dy)/l2,t=Math.max(0,Math.min(1,t0)),d=Math.hypot(ax+t*dx-qx,ay+t*dy-qy);if(d<best){best=d;sd=-Math.sign(dx*(qy-ay)-dy*(qx-ax));cap=(k===0&&t0<0)||(k===n-1&&t0>1)}}
      if(best<2.5&&!cap){const f=Math.floor(best*sd+2.5);if(f>=0&&f<5)ui.px(x+i,y+j,B5[f])}}};
    band([[-2,yb],[xl,yb]].concat(tro(-Math.PI,.4)));band(tro(-.2,Math.PI).concat([[xr,yb],[22,yb]]))}
}

function setup(){

  const sa=getComputedStyle(document.getElementById('sa')),st=parseFloat(sa.paddingTop)||0,sb=parseFloat(sa.paddingBottom)||0,vh=Math.min(window.innerHeight,window.visualViewport?window.visualViewport.height:1e9);

}
function focus(){
  const P=HBR.proj(L);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const add=(i,j,z)=>{const p=P(i+.5,j+.5,z);x0=Math.min(x0,p[0]-34);x1=Math.max(x1,p[0]+34);y0=Math.min(y0,p[1]-40);y1=Math.max(y1,p[1]+20)};
  run.track.forEach(p=>add(p.i,p.j,p.z1));run.ret.forEach(p=>add(p.i,p.j,0));add(LEVEL.target[0],LEVEL.target[1],0);add(run.head.i,run.head.j,run.head.z);
  return{x:(x0+x1)/2,y:(y0+y1)/2-6}
}
function clampCam(){const mx=Wc/2-70,Mx=L.W-Wc/2+70,my=lay.areaH/2-50,My=L.H-lay.areaH/2+50;cam.x=Math.max(Math.min(mx,Mx),Math.min(Math.max(mx,Mx),cam.x));cam.y=Math.max(Math.min(my,My),Math.min(Math.max(my,My),cam.y))}

function loadLevel(i){hintUsed=false;hintK=null;hintSeq=null;hintMsg='';LEVEL=LEVELS[i];saved.cur=i;store.set('hb4',saved);stat=null;statKey='';overlay=saved.help?(neuList().length?'neu':null):'help';inGame=true;init()}
const STY={meadow:'B1',winter:'A2',desert:'D1',coast:'C1'},TCOL={meadow:['red','blue','green'],winter:['blue','red'],desert:['orange','red'],coast:['green','blue']},THEMES=['meadow','winter','desert','coast'],DIFFN=['Leicht','Mittel','Schwer'];
const SPECS=[{min:8,max:12,groups:[['kids'],['fam']],loop:'no',extras:1,pond:[4,6],maxSol:100,flags:0},{min:10,max:14,groups:[['fam'],['teens']],loop:'allow',extras:1,pond:[4,6],maxSol:60,flags:1},{min:12,max:17,groups:[['teens'],['fans']],loop:'allow',extras:2,pond:[4,6],maxSol:30,budget:15000,flags:2}];

function randOpts(){const U=LEVELS.filter((l,i)=>unlocked(i)),seen=new Set(),bases=[];U.forEach(l=>{const k=l.n+'|'+l.station+'|'+JSON.stringify(l.ret);if(!seen.has(k)){seen.add(k);bases.push(l)}});
  return{bases,kinds:[...new Set(['G','L','R','A','B'].concat(...U.map(l=>Object.keys(l.inv))))],flags:Math.max(0,...U.map(l=>(l.flags||[]).length))}}

function startRandom(diff){
  lastDiff=diff;overlay='busy';busyMsg='Rätsel wird erzeugt';const t0=performance.now();
  const step=()=>{
    const seed=(Math.random()*1e9)|0;let l=null;try{l=HBG.make(SPECS[diff],seed,2,randOpts())}catch(e){l=null}
    if(l){playRandom(randLevel(l,diff,seed));return}
    if(performance.now()-t0<4500){setTimeout(step,0);return}
    const cand=POOL.filter(e=>e.d===diff);const e=(cand.length?cand:POOL)[Math.floor(Math.random()*(cand.length||POOL.length))];
    if(e)playRandom(expandPool(e,seed));else{overlay='rand'}

}
